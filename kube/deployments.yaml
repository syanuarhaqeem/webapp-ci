#
# Postgres Deployment
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-db
  template:
    metadata:
      labels:
        app: webapp-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          resources:
            requests:
              cpu: "100m"       
              memory: "128Mi"   
            limits:
              cpu: "250m"       
              memory: "256Mi" 
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: webapp-db-credentials
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: webapp-db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webapp-db-credentials
                  key: DB_PASS
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
#
# Webapp Deployment
#
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          # webapp version 1
          image: 202077789824.dkr.ecr.ap-southeast-1.amazonaws.com/webapp:v1
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"       
              memory: "128Mi"   
            limits:       
              memory: "256Mi"  
          env:
            - name: DB_HOST
              value: webapp-db-svc              
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: webapp-db-credentials
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: webapp-db-credentials
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: webapp-db-credentials
                  key: DB_PASS
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
