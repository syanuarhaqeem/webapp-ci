name: Build and deploy webapp

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::202077789824:role/webapp-ci-github-actions
          aws-region: ap-southeast-1

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin 202077789824.dkr.ecr.ap-southeast-1.amazonaws.com

      - name: Build and push image to ECR
        run: |
          docker build -t webapp:${IMAGE_TAG} .
          docker tag webapp:${IMAGE_TAG} 202077789824.dkr.ecr.ap-southeast-1.amazonaws.com/webapp:${IMAGE_TAG}
          docker push 202077789824.dkr.ecr.ap-southeast-1.amazonaws.com/webapp:${IMAGE_TAG}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ant-web-cluster --region ap-southeast-1
          kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kube/
          kubectl rollout status deployment/webapp

      - name: Update webapp image
        run: |
          kubectl set image deployment/webapp webapp=202077789824.dkr.ecr.ap-southeast-1.amazonaws.com/webapp:${IMAGE_TAG}
          kubectl rollout status deployment/webapp

      - name: Success
        run: echo "Deployed successfully with image ${IMAGE_TAG}"
